<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PashaDrop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-main: #131316;
            --bg-card: #1c1c21;
            --bg-elev: #232329;
            --border: #2a2a30;
            --border-soft: #35353c;
            --text: #e8e8ee;
            --text-dim: #8888a0;
            --text-mute: #55555f;
            --red: #e11d48;
            --red-glow: rgba(225, 29, 72, 0.5);
            --red-soft: rgba(225, 29, 72, 0.15);
        }

        html, body { background: var(--bg-main); }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(225, 29, 72, 0.08), transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(120, 20, 40, 0.06), transparent 50%),
                linear-gradient(180deg, #131316 0%, #0d0d10 100%);
            z-index: -1;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 720px;
        }

        .screen.active { display: flex; }

        .logo {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
            text-align: center;
            color: #fff;
            display: inline-block;
        }

        .logo .logo-drop {
            color: var(--red);
            text-shadow: 0 0 20px var(--red-glow);
        }

        .logo-badge {
            display: inline-block;
            padding: 3px 10px;
            margin-left: 8px;
            background: rgba(225, 29, 72, 0.12);
            border: 1px solid rgba(225, 29, 72, 0.35);
            border-radius: 100px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #f43f5e;
            vertical-align: middle;
            position: relative;
            top: -3px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .version-badge {
            display: inline-block;
            padding: 4px 12px;
            margin-bottom: 14px;
            background: rgba(225, 29, 72, 0.1);
            border: 1px solid rgba(225, 29, 72, 0.35);
            border-radius: 100px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #f43f5e;
        }

        .balance {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .balance .coin { font-size: 18px; }
        .balance .amount { color: #fff; }

        .sound-toggle {
            position: fixed;
            top: 14px;
            right: 14px;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 500;
            padding: 0;
            transition: border-color 0.2s;
        }

        .sound-toggle:hover { border-color: rgba(225, 29, 72, 0.4); }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .nav-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            justify-content: center;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.03); }

        .nav-btn.active {
            background: var(--bg-elev);
            color: #fff;
            border-color: rgba(225, 29, 72, 0.4);
            box-shadow: 0 0 0 1px rgba(225, 29, 72, 0.15), 0 0 12px rgba(225, 29, 72, 0.25);
        }

        /* ============ КЕЙСЫ ============ */
        .case-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
        }

        .case-card {
            position: relative;
            padding: 24px 16px 20px;
            border-radius: 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Обычный кейс — как на картинке 2 (оранжевый CS) */
        .case-card.basic {
            background:
                radial-gradient(ellipse at 50% 100%, rgba(232, 119, 34, 0.2), transparent 70%),
                radial-gradient(ellipse at 50% 0%, rgba(255, 165, 0, 0.1), transparent 60%),
                var(--bg-card);
        }

        /* Премиум кейс — как на картинке 1 (сине-красный) */
        .case-card.premium {
            background:
                radial-gradient(ellipse at 50% 100%, rgba(30, 60, 150, 0.3), transparent 70%),
                radial-gradient(ellipse at 50% 0%, rgba(180, 30, 40, 0.2), transparent 60%),
                var(--bg-card);
        }

        .case-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(225, 29, 72, 0.6), transparent 40%, transparent 60%, rgba(225, 29, 72, 0.6));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1;
            pointer-events: none;
        }

        .case-card:hover::before { opacity: 1; }

        .case-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .case-card:active { transform: translateY(0) scale(0.98); }

        .case-card.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

        /* Обложка кейса */
        .case-art {
            position: relative;
            width: 100%;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        /* Простая SVG-модель кейса */
        .case-art svg {
            width: 140px;
            height: auto;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
            transition: transform 0.3s;
        }

        .case-card:hover .case-art svg {
            transform: translateY(-4px) scale(1.05);
        }

        .case-art .case-glow {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 20px;
            border-radius: 50%;
            filter: blur(10px);
            opacity: 0.6;
            z-index: -1;
        }

        .case-card.basic .case-glow { background: rgba(232, 119, 34, 0.7); }
        .case-card.premium .case-glow { background: rgba(225, 29, 72, 0.6); }

        /* Топ-фото кейса (миниатюра с тенью) */
        .case-preview {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 34px;
            height: 44px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .case-card:hover .case-preview { opacity: 1; }

        .case-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .case-name {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 4px;
            color: #fff;
            letter-spacing: -0.01em;
        }

        .case-desc {
            font-size: 11px;
            color: var(--text-mute);
            margin-bottom: 12px;
            letter-spacing: 0.2px;
        }

        .case-price {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 100px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(251, 191, 36, 0.35);
            font-size: 13px;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 0.3px;
        }

        /* ============ КНОПКИ ============ */
        button {
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: var(--bg-elev);
            border: 1px solid rgba(225, 29, 72, 0.3);
            border-radius: 10px;
            padding: 14px 32px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
            position: relative;
        }

        button:hover:not(:disabled) {
            border-color: rgba(225, 29, 72, 0.7);
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.35), inset 0 0 15px rgba(225, 29, 72, 0.1);
        }

        button:active:not(:disabled) { transform: scale(0.97); }
        button:disabled { opacity: 0.35; cursor: not-allowed; border-color: var(--border); }

        .back-btn {
            align-self: flex-start;
            background: transparent;
            padding: 8px 14px;
            font-size: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        .back-btn:hover { border-color: var(--border-soft); color: var(--text); box-shadow: none; }

        .start-btn {
            margin-top: 12px;
            padding: 16px 44px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .start-btn.hidden { display: none; }

        .result-actions {
            display: none;
            gap: 10px;
            margin-top: 16px;
            width: 100%;
            max-width: 400px;
        }

        .result-actions.active { display: flex; }
        .result-actions button { flex: 1; padding: 14px 12px; font-size: 14px; }

        .btn-keep { border-color: rgba(34, 197, 94, 0.4); }
        .btn-keep:hover:not(:disabled) { border-color: rgba(34, 197, 94, 0.8); box-shadow: 0 0 20px rgba(34, 197, 94, 0.35); }

        .btn-sell { border-color: rgba(251, 191, 36, 0.4); }
        .btn-sell:hover:not(:disabled) { border-color: rgba(251, 191, 36, 0.8); box-shadow: 0 0 20px rgba(251, 191, 36, 0.35); }

        /* ============ ЛЕНТА ============ */
        .strip-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
            border-radius: 16px;
            background: #0a0a0d;
            border: 1px solid rgba(225, 29, 72, 0.25);
            box-shadow: 0 0 30px rgba(225, 29, 72, 0.15), inset 0 0 40px rgba(0, 0, 0, 0.6);
            margin-top: 16px;
            display: none;
        }

        .strip-wrapper.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .strip {
            display: flex;
            gap: 14px;
            padding: 30px 16px;
            height: 100%;
            align-items: center;
            will-change: transform;
        }

        .photo {
            flex: 0 0 150px;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: #15151a;
            border: 2px solid #2a2a30;
            flex-shrink: 0;
        }

        .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .rarity-badge {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 6px;
            text-align: center;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.85);
        }

        .rarity-common    { border-color: #94a3b8; }
        .rarity-common .rarity-badge    { color: #94a3b8; }
        .rarity-rare      { border-color: #3b82f6; box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }
        .rarity-rare .rarity-badge      { color: #3b82f6; }
        .rarity-epic      { border-color: #a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }
        .rarity-epic .rarity-badge      { color: #a855f7; }
        .rarity-legendary { border-color: #f59e0b; box-shadow: 0 0 14px rgba(245, 158, 11, 0.5); }
        .rarity-legendary .rarity-badge { color: #f59e0b; }
        .rarity-mythic    { border-color: #ef4444; box-shadow: 0 0 16px rgba(239, 68, 68, 0.6); }
        .rarity-mythic .rarity-badge    { color: #ef4444; }
        .rarity-exclusive { border-color: #06b6d4; box-shadow: 0 0 18px rgba(6, 182, 212, 0.6); }
        .rarity-exclusive .rarity-badge { color: #06b6d4; }

        .pointer {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 2px;
            background: var(--red);
            transform: translateX(-50%);
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 12px var(--red), 0 0 25px var(--red-glow);
        }

        .strip-wrapper::before,
        .strip-wrapper::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 100px;
            z-index: 4;
            pointer-events: none;
        }

        .strip-wrapper::before { left: 0; background: linear-gradient(90deg, #0a0a0d 20%, transparent); }
        .strip-wrapper::after { right: 0; background: linear-gradient(-90deg, #0a0a0d 20%, transparent); }

        .result {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            min-height: 50px;
            line-height: 1.5;
        }

        .result.show { opacity: 1; }

        /* ============ ИНВЕНТАРЬ ============ */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }

        .inv-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #2a2a30;
            cursor: pointer;
            background: #15151a;
            aspect-ratio: 3 / 4;
            transition: all 0.2s;
        }

        .inv-item:hover {
            border-color: rgba(225, 29, 72, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }

        .inv-item:active { transform: scale(0.97); }
        .inv-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .inv-item .inv-count {
            position: absolute;
            top: 4px; right: 4px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            border: 1px solid var(--border-soft);
        }

        .inv-item .inv-rarity {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 4px;
            text-align: center;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.9);
        }

        .inv-item.rarity-common    { border-color: #94a3b8; }
        .inv-item.rarity-common .inv-rarity    { color: #94a3b8; }
        .inv-item.rarity-rare      { border-color: #3b82f6; }
        .inv-item.rarity-rare .inv-rarity      { color: #3b82f6; }
        .inv-item.rarity-epic      { border-color: #a855f7; }
        .inv-item.rarity-epic .inv-rarity      { color: #a855f7; }
        .inv-item.rarity-legendary { border-color: #f59e0b; }
        .inv-item.rarity-legendary .inv-rarity { color: #f59e0b; }
        .inv-item.rarity-mythic    { border-color: #ef4444; }
        .inv-item.rarity-mythic .inv-rarity    { color: #ef4444; }
        .inv-item.rarity-exclusive { border-color: #06b6d4; }
        .inv-item.rarity-exclusive .inv-rarity { color: #06b6d4; }

        .empty-msg {
            text-align: center;
            color: var(--text-mute);
            padding: 50px 20px;
            font-size: 13px;
        }

        /* ============ МОДАЛКИ ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-box img {
            width: 130px;
            height: 175px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid var(--border-soft);
            margin-bottom: 16px;
        }

        .modal-rarity { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
        .modal-count { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
        .modal-price { font-size: 14px; font-weight: 800; color: #fbbf24; margin-bottom: 20px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 12px; font-size: 13px; }
        .modal-close { border-color: var(--border); color: var(--text-dim); }
        .modal-close:hover { border-color: var(--border-soft); color: var(--text); box-shadow: none; }

        /* ============ АПГРЕЙД ============ */
        .upgrade-screen { width: 100%; max-width: 640px; }

        .wheel-wrap {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 10px auto 20px;
        }

        .wheel-svg { width: 100%; height: 100%; }

        .wheel-svg .wheel-bg { fill: #1a1a1f; stroke: #2a2a30; stroke-width: 2; }

        .wheel-svg .fail-sector {
            fill: #2e2e36;
            opacity: 1;
            transition: fill 0.3s;
        }

        .wheel-svg .chance-sector {
            fill: #2e2e36;
            opacity: 1;
            transition: fill 0.3s;
        }

        .wheel-wrap.armed .wheel-svg .fail-sector { fill: #dc2626; opacity: 0.9; }
        .wheel-wrap.armed .wheel-svg .chance-sector { fill: #16a34a; opacity: 0.9; }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--bg-main);
            border: 2px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        }

        .wheel-center .wheel-icon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            filter: grayscale(1) opacity(0.4);
            transition: filter 0.3s;
        }

        .wheel-wrap.armed .wheel-center .wheel-icon { filter: none; }

        .wheel-center .wheel-icon img { width: 100%; height: 100%; object-fit: cover; }

        .arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 122px;
            margin-left: -2.5px;
            margin-top: 0;
            transform-origin: 50% 0%;
            z-index: 5;
            pointer-events: none;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.3, 1);
            filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.8));
        }

        .arrow::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border: 9px solid transparent;
            border-top-color: var(--red);
            filter: drop-shadow(0 0 6px var(--red));
        }

        .arrow::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #0a0a0d, #000000);
            border-radius: 3px;
            border: 1px solid #333333;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        }

        .chance-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 14px;
            min-height: 20px;
        }

        .chance-text b { color: #fff; font-size: 15px; }

        .upgrade-main-btn {
            width: 100%;
            padding: 18px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: var(--bg-elev);
            border: 1px solid rgba(225, 29, 72, 0.3);
            border-radius: 12px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .upgrade-main-btn:not(:disabled) { color: #fff; border-color: rgba(225, 29, 72, 0.5); }
        .upgrade-main-btn:not(:disabled):hover {
            border-color: rgba(225, 29, 72, 0.9);

        .mode-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .mode-btn {
            padding: 12px 6px;
            font-size: 12px;
            font-weight: 800;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn:hover:not(:disabled) { border-color: var(--border-soft); color: var(--text); }
        .mode-btn.active {
            background: var(--bg-elev);
            border-color: rgba(225, 29, 72, 0.5);
            color: #fff;
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.25);
        }

        .swap-areas {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .swap-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .swap-box h3 {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-dim);
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.4;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .swap-item {
            width: 100%;
            flex: 1;
            border-radius: 10px;
            background: var(--bg-main);
            border: 2px dashed var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: border-color 0.2s;
        }

        .swap-item:hover { border-color: var(--border-soft); }
        .swap-item.filled { border-style: solid; border-color: var(--border-soft); }
        .swap-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .swap-item .swap-plus {
            font-size: 38px;
            color: var(--border-soft);
            font-weight: 300;
        }

        .swap-item .swap-label {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 8px;
            text-align: center;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.9);
        }

        .swap-arrow { font-size: 22px; color: var(--red); font-weight: bold; text-shadow: 0 0 10px var(--red-glow); }

        .pick-modal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 12px;
        }

        .pick-modal-hint { text-align: center; color: var(--text-dim); font-size: 12px; margin-bottom: 8px; }

        @keyframes tinyShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-1px, 1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, -1px); }
        }

        .wheel-wrap.shaking { animation: tinyShake 0.1s infinite; }

        /* ============ РАБОТА ============ */
        .work-panel {
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .work-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            font-size: 56px;
            background: var(--bg-card);
            border: 2px solid rgba(225, 29, 72, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.15s;
            padding: 0;
            box-shadow: 0 0 30px rgba(225, 29, 72, 0.2);
        }

        .work-btn:hover { border-color: rgba(225, 29, 72, 0.8); box-shadow: 0 0 45px rgba(225, 29, 72, 0.4); }
        .work-btn:active { transform: scale(0.95); box-shadow: 0 0 60px rgba(225, 29, 72, 0.6); }

        .work-info {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.6;
        }

        .work-info span { color: #fff; font-weight: 800; }
        .work-earned { margin-top: 16px; font-size: 18px; font-weight: 800; color: #fbbf24; min-height: 24px; }

        .float-coin {

            pointer-events: none;

            animation: floatUp 0.8s ease-out forwards;
            font-weight: 800;
            color: #fbbf24;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.8);

        @media (max-width: 600px) {

    <script>
        // ============================================
        // ЗВУКИ
        // ============================================
        let audioCtx = null;
        let soundEnabled = true;

        function getAudioCtx() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) { soundEnabled = false; }
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTick() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx(); if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 800 + Math.random() * 400;
            osc.type = 'square';
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.05);
        }

        function playSuccess() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx(); if (!ctx) return;
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'triangle';
                osc.frequency.value = freq;
                const start = ctx.currentTime + i * 0.12;
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(0.15, start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
                osc.start(start); osc.stop(start + 0.4);
            });
        }

        function playFail() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx(); if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
        }

        function playCoin() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx(); if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
        }

        function playReveal() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx(); if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
        }

        function playStart() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx(); if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.15);

        // ============================================

        function pickAutoTarget(srcRarity, chance) {
            const srcPrice = rarityRewards[srcRarity];
            const srcIdx = rarityOrder.indexOf(srcRarity);

            const candidates = [];
            for (let i = srcIdx + 1; i < rarityOrder.length; i++) {
                const r = rarityOrder[i];
                const price = rarityRewards[r];
                const actualChance = srcPrice / price;
                const dist = Math.abs(actualChance - chance);
                candidates.push({ rarity: r, actualChance, dist });
            }

            if (candidates.length === 0) return null;
            candidates.sort((a, b) => a.dist - b.dist);
            return candidates[0].rarity;
        }

        function findPhotoByRarity(rarity) {
            const ids = Object.keys(inventory);
            for (const id of ids) {
                if (inventory[id].rarity === rarity) return id;
            }
            for (const c of Object.values(cases)) {
                for (const p of c.photos) {
                    if (p.rarity === rarity) return p.id;
                }
            }
            return null;
        }

            if (!selectedSrcId || !inventory[selectedSrcId]) {
                autoDstId = null;

            const srcItem = inventory[selectedSrcId];
            const srcIdx = rarityOrder.indexOf(srcItem.rarity);

            if (srcIdx >= rarityOrder.length - 1) {
                autoDstId = null;
                updateUpgradeUI();
                return;
            }

            const targetRarity = pickAutoTarget(srcItem.rarity, upgradeChance);
            autoDstId = findPhotoByRarity(targetRarity);

            updateUpgradeUI();
        }

        function getRealChance() {
            if (!selectedSrcId || !autoDstId) return 0;
            const src = inventory[selectedSrcId];
            const dst = allPhotos[autoDstId];
            if (!src || !dst) return 0;

            const srcPrice = rarityRewards[src.rarity];
            const dstPrice = rarityRewards[dst.rarity];
            return Math.min(0.95, Math.max(0.01, srcPrice / dstPrice));
        }

        function getTargetRarity() {
            if (!autoDstId) return null;
            const dst = allPhotos[autoDstId];
            return dst ? dst.rarity : null;
        }

        // ============================================
        // КОЛЕСО
        // ============================================
        function drawChanceSector(chance) {
            const cx = 100, cy = 100;
            const rOuter = 95;
            const rInner = 58;

            const angleDeg = chance * 360;
            const startAngle = 180;

            if (angleDeg <= 0.5) {
                chanceSector.setAttribute('d', '');
                return;
            }
            if (angleDeg >= 359.5) {
                const d = `
                    M ${cx} ${cy + rOuter}
                    A ${rOuter} ${rOuter} 0 1 1 ${cx - 0.01} ${cy + rOuter}
                    L ${cx - 0.01} ${cy + rInner}
                    A ${rInner} ${rInner} 0 1 0 ${cx} ${cy + rInner}
                    Z
                `;
                chanceSector.setAttribute('d', d);
                return;
            }

            const endAngleDeg = (startAngle + angleDeg) % 360;
            const endRad = (endAngleDeg - 90) * Math.PI / 180;
            const xOuter = cx + rOuter * Math.cos(endRad);
            const yOuter = cy + rOuter * Math.sin(endRad);
            const xInner = cx + rInner * Math.cos(endRad);
            const yInner = cy + rInner * Math.sin(endRad);

            const startRad = (startAngle - 90) * Math.PI / 180;
            const sxOuter = cx + rOuter * Math.cos(startRad);
            const syOuter = cy + rOuter * Math.sin(startRad);
            const sxInner = cx + rInner * Math.cos(startRad);
            const syInner = cy + rInner * Math.sin(startRad);

            const largeArc = angleDeg > 180 ? 1 : 0;

            const d = `
                M ${sxOuter} ${syOuter}
                A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${xOuter} ${yOuter}
                L ${xInner} ${yInner}
                A ${rInner} ${rInner} 0 ${largeArc} 0 ${sxInner} ${syInner}
                Z
            `;
            chanceSector.setAttribute('d', d);
        }

        upgradeMainBtn.addEventListener('click', () => {
            if (isUpgrading) return;

            const srcItem = inventory[selectedSrcId];

            const success = Math.random() < chance;

            isUpgrading = true;
            upgradeMainBtn.disabled = true;
            wheelWrap.classList.add('shaking');

            playStart();

            clearInterval(tickInterval);
            let tickCount = 0;
            tickInterval = setInterval(() => {
                playTick();
                tickCount++;
                if (tickCount > 25) {
                    clearInterval(tickInterval);
                    tickInterval = setInterval(() => playTick(), 200);
                }
            }, 80);

            let finalAngle;
            const chanceAngle = chance * 360;

            if (success) {
                const inGreen = 0.05 + Math.random() * 0.9;
                finalAngle = chanceAngle * inGreen;
            } else {
                const redRange = 360 - chanceAngle;
                const inRed = 0.05 + Math.random() * 0.9;
                finalAngle = chanceAngle + redRange * inRed;
            }

            const totalRotation = 360 * 5 + finalAngle;

            arrow.style.transition = 'none';
            arrow.style.transform = 'rotate(0deg)';
            void arrow.offsetWidth;

            arrow.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.3, 1)';
            arrow.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                clearInterval(tickInterval);

                showUpgradeResult(srcItem, dstItem, success, chance);

            arrow.style.transition = 'none';
            arrow.style.transform = `rotate(${finalAngle}deg)`;
            void arrow.offsetWidth;
            arrow.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.3, 1)';

            removeFromInventory(selectedSrcId, 1);

            }

            if (!inventory[selectedSrcId]) {
                selectedSrcId = null;
                autoDstId = null;
            } else {
                recalcUpgrade();
            }

            renderInventory();
            isUpgrading = false;

            setTimeout(() => updateUpgradeUI(), 1500);
        }

            coin.className = 'float-coin';
            coin.textContent = '+1 🪙';
            const rect = workBtn.getBoundingClientRect();
            const x = e.clientX || (rect.left + rect.width / 2);
            const y = e.clientY || (rect.top + rect.height / 2);
            coin.style.left = x + 'px';
            coin.style.top = y + 'px';
            document.body.appendChild(coin);
            setTimeout(() => coin.remove(), 1000);

            clearTimeout(workBtn._t);
            workBtn._t = setTimeout(() => { workEarned.textContent = ''; }, 400);
        });

        // ============================================
        // ВЫБОР КЕЙСА
        // ============================================
        document.querySelectorAll('.case-card').forEach(card => {
            card.addEventListener('click', () => {
                const key = card.dataset.case;
                const price = casePrices[key];

                if (balance < price) {
                    card.animate([
                        { transform: 'translateX(0)' },
                        { transform: 'translateX(-6px)' },
                        { transform: 'translateX(6px)' },
                        { transform: 'translateX(0)' }
                    ], { duration: 250 });
                    return;
                }

                currentCase = cases[key];
                currentCaseKey = key;
                caseTitle.textContent = currentCase.title;
                updateStartBtn();

                strip.innerHTML = '';
                strip.style.transition = 'none';
                strip.style.transform = 'translateX(0)';
                stripWrapper.classList.remove('active');
                startBtn.classList.remove('hidden');
                resultActions.classList.remove('active');
                resultEl.classList.remove('show');
                resultEl.textContent = '';
                pendingPhoto = null;

                screenChoose.classList.remove('active');
                screenSpin.classList.add('active');
            });
        });

        backBtn.addEventListener('click', () => {
            if (isSpinning) return;
            if (pendingPhoto) {
                alert('Сначала реши: забрать или продать фото!');
                return;
            }
            screenSpin.classList.remove('active');
            screenChoose.classList.add('active');
            renderInventory();
        });

        upgradeBackBtn.addEventListener('click', () => {
            if (isUpgrading) return;
            screenUpgrade.classList.remove('active');
            screenChoose.classList.add('active');
            renderInventory();
        });

        // ============================================
        // ЛЕНТА КЕЙСА
        // ============================================
        function buildStrip() {
            strip.innerHTML = '';
            const photos = currentCase.photos;
            for (let i = 0; i < 4; i++) {
                photos.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `photo rarity-${item.rarity}`;
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.alt = '';
                    img.loading = 'lazy';
                    const badge = document.createElement('div');
                    badge.className = 'rarity-badge';
                    badge.textContent = rarityNames[item.rarity];
                    card.appendChild(img);
                    card.appendChild(badge);
                    strip.appendChild(card);
                });
            }
        }

        function spin() {
            if (isSpinning) return;
            const price = casePrices[currentCaseKey];
            if (balance < price) {
                resultEl.innerHTML = `Недостаточно монет — нужно 🪙 ${price}`;
                resultEl.classList.add('show');
                return;
            }

            balance -= price;
            updateBalance();

            isSpinning = true;
            startBtn.classList.add('hidden');
            resultActions.classList.remove('active');
            resultEl.classList.remove('show');
            resultEl.textContent = '';
            pendingPhoto = null;

            stripWrapper.classList.add('active');
            buildStrip();

            strip.style.transition = 'none';
            strip.style.transform = 'translateX(0)';
            void strip.offsetHeight;

            playStart();
            clearInterval(tickInterval);
            tickInterval = setInterval(playTick, 80);
            setTimeout(() => {
                clearInterval(tickInterval);
                tickInterval = setInterval(playTick, 180);
            }, 2000);
            setTimeout(() => {
                clearInterval(tickInterval);
                tickInterval = setInterval(playTick, 350);
            }, 3000);

            const first = strip.children[0];
            const cardWidth = first.offsetWidth + 14;
            const wrapperWidth = stripWrapper.offsetWidth;
            const centerOffset = wrapperWidth / 2 - first.offsetWidth / 2;

            const photosLen = currentCase.photos.length;
            const randomIndex = photosLen + Math.floor(Math.random() * photosLen);
            const targetX = -(randomIndex * cardWidth) + centerOffset;
            const duration = 3500;

            strip.style.transition = `transform ${duration}ms cubic-bezier(0.2, 0.7, 0.3, 1)`;
            strip.style.transform = `translateX(${targetX}px)`;

            const wonIdx = randomIndex % photosLen;
            const wonPhoto = currentCase.photos[wonIdx];

            setTimeout(() => {
                clearInterval(tickInterval);
                tickInterval = null;

                const rarity = wonPhoto.rarity;
                const color = rarityColors[rarity];
                const reward = rarityRewards[rarity];

                playReveal();

                pendingPhoto = wonPhoto;
                resultEl.innerHTML =
                    `Выпало: <span style="color:${color}">${rarityNames[rarity]}</span><br>` +
                    `<span style="color:#888;font-size:13px;">Забрать или продать за 🪙 ${reward}?</span>`;
                resultEl.classList.add('show');

                sellBtn.textContent = `Продать — ${reward} 🪙`;
                resultActions.classList.add('active');
                isSpinning = false;
            }, duration + 50);
        }

        keepBtn.addEventListener('click', () => {
            if (!pendingPhoto) return;
            addToInventory(pendingPhoto);
            playCoin();
            resultEl.innerHTML =
                `Забрал: <span style="color:${rarityColors[pendingPhoto.rarity]}">${rarityNames[pendingPhoto.rarity]}</span><br>` +
                `<span style="color:#888;font-size:13px;">Фото в инвентаре</span>`;
            resultEl.classList.add('show');
            resultActions.classList.remove('active');
            pendingPhoto = null;
            startBtn.classList.remove('hidden');
        });

        sellBtn.addEventListener('click', () => {
            if (!pendingPhoto) return;
            const reward = rarityRewards[pendingPhoto.rarity];
            balance += reward;
            updateBalance();
            playCoin();
            resultEl.innerHTML =
                `Продал: <span style="color:${rarityColors[pendingPhoto.rarity]}">${rarityNames[pendingPhoto.rarity]}</span><br>` +
                `<span style="color:#fbbf24;">+ ${reward} 🪙</span>`;
            resultEl.classList.add('show');
            resultActions.classList.remove('active');
            pendingPhoto = null;
            startBtn.classList.remove('hidden');
        });

        // ============================================
        // СТАРТ
        // ============================================
        startBtn.addEventListener('click', spin);

        updateBalance();
        renderInventory();
        updateUpgradeUI();

        document.addEventListener('click', () => {
            if (soundEnabled) getAudioCtx();
        }, { once: true });
    </script>

</body>
</html>
